<!DOCTYPE html>
<html>
<head>
    <title>Test Supabase Auth</title>
    <script type="module">
        // Read your .env values and paste them here:
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // Replace with your actual URL
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Replace with your actual anon key
        
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        window.testLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Testing login with:', email);
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) {
                    document.getElementById('result').innerHTML = `<div style="color: red;">Error: ${error.message}</div>`;
                    console.error('Login error:', error);
                } else {
                    document.getElementById('result').innerHTML = `<div style="color: green;">Success! Token: ${data.session.access_token.substring(0, 50)}...</div>`;
                    console.log('Login success:', data);
                }
            } catch (err) {
                document.getElementById('result').innerHTML = `<div style="color: red;">Exception: ${err.message}</div>`;
                console.error('Exception:', err);
            }
        };
    </script>
</head>
<body style="padding: 50px; font-family: Arial;">
    <h2>Test Supabase Login</h2>
    <p>Edit this file and add your SUPABASE_URL and SUPABASE_ANON_KEY at the top</p>
    <input id="email" type="email" placeholder="Email" style="display: block; margin: 10px 0; padding: 10px; width: 300px;">
    <input id="password" type="password" placeholder="Password" style="display: block; margin: 10px 0; padding: 10px; width: 300px;">
    <button onclick="testLogin()" style="padding: 10px 20px;">Test Login</button>
    <div id="result" style="margin-top: 20px;"></div>
</body>
</html>
